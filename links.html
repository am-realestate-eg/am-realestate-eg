<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.M.A - روابط التواصل</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0d141e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            object-fit: cover;
        }

        h1 {
            color: #d4af37;
            font-size: 24px;
            margin-bottom: 5px;
        }

        p {
            color: #a0aab5;
            font-size: 16px;
        }

        .links-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #1a2536, #0d141e);
            border: 1px solid #d4af37;
            border-radius: 12px;
            text-decoration: none;
            color: #d4af37;
            font-size: 18px;
            font-weight: 700;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .link-btn:hover {
            background: #d4af37;
            color: #0d141e;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
        }

        .icon {
            width: 24px;
            height: 24px;
            margin-left: 12px;
            fill: currentColor;
        }

        .footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 14px;
            color: #6c7a89;
            text-align: center;
        }
    </style>
</head>
